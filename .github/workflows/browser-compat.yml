name: Browser compatibility check

on:
  push:
    branches: [main, fix/review-v16-safe-crops, feat/safe-gold-json-restore]
    paths:
      - 'index.html'
      - 'review.html'
      - 'review.css'
      - 'review.js'
      - 'review-restore.js'
      - 'tests/review-restore*.mjs'
      - 'cards/**'
      - 'tests/browser-compat.mjs'
      - 'training/**'
      - 'tools/build_student_dataset.mjs'
      - 'tools/build_review_assets.py'
      - 'tools/audit_review_assets.py'
      - 'tests/review-state.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/browser-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify all review JPEGs
        run: |
          python -m pip install --quiet pillow
          python tools/audit_review_assets.py

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate build and student schema
        run: |
          npm ci
          npm run test:student
          npm run test:state
          npm run test:restore
          npm run build

      - name: Install browser engines
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit

      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/site.log 2>&1 &
          sleep 2

      - name: Test Chromium Firefox and WebKit
        run: node tests/browser-compat.mjs

      - name: Test local Gold restore in Chromium Firefox and WebKit
        run: npm run test:restore:browser

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-compat-screenshots
          path: 'browser-*.png'
          if-no-files-found: ignore
