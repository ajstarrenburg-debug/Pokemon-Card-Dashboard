name: Materialize card sprite

on:
  push:
    branches: [main]
    paths:
      - 'sprite/data.js'
      - '.github/workflows/materialize-sprite.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode sprite JPEG
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          src = Path('sprite/data.js').read_text(encoding='utf-8-sig').strip()
          marker = 'window.SPRITE_B64='
          pos = src.find(marker)
          if pos < 0:
              raise SystemExit('SPRITE_B64 marker not found')
          rhs = src[pos + len(marker):].strip()
          q1 = rhs.find('"')
          q2 = rhs.rfind('"')
          if q1 < 0 or q2 <= q1:
              raise SystemExit('Could not find base64 quotes')
          payload = ''.join(rhs[q1+1:q2].split())
          raw = base64.b64decode(payload, validate=True)
          if not raw.startswith(b'\xff\xd8') or not raw.endswith(b'\xff\xd9'):
              raise SystemExit('Decoded file is not a complete JPEG')
          Path('sprite/cards.jpg').write_bytes(raw)
          print('Wrote sprite/cards.jpg:', len(raw), 'bytes')
          PY
      - name: Commit generated JPEG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sprite/cards.jpg
          if git diff --cached --quiet; then
            echo "No JPEG change"
          else
            git commit -m "Materialize card sprite JPEG"
            git push
          fi
