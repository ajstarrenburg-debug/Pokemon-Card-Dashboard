<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Direct image compatibility test</title><style>body{margin:0;background:#0d1015;color:#eef2f7;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.box{max-width:520px;padding:20px;text-align:center}img{display:block;width:min(420px,90vw);height:auto;margin:16px auto;border:2px solid #34e3ff;border-radius:10px;background:#000}small{color:#9fa9b7}</style></head><body><div class="box"><h1>Direct JPEG browser test</h1><img id="cardImage" src="cards/browser-test.jpg?v=1" alt="Browser compatibility test"><small id="status">loading</small></div><script>const i=document.getElementById('cardImage'),s=document.getElementById('status');function ok(){s.textContent=`loaded ${i.naturalWidth}×${i.naturalHeight}`;document.body.dataset.imageStatus='loaded'}function bad(){s.textContent='IMAGE ERROR';document.body.dataset.imageStatus='error'};i.addEventListener('load',ok);i.addEventListener('error',bad);if(i.complete){i.naturalWidth?ok():bad()}</script></body></html>
