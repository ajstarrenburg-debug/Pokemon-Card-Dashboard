name: Browser compatibility check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/review-v16-safe-crops]
    paths:
      - 'index.html'
      - 'review.html'
      - 'review.css'
      - 'review.js'
      - 'cards/**'
      - 'tests/browser-compat.mjs'
      - 'training/**'
      - 'tools/build_student_dataset.mjs'
      - 'tools/build_review_assets.py'
      - 'tools/audit_review_assets.py'
      - 'tests/review-state.mjs'
      - 'tests/centering-geometry.mjs'
      - 'tests/centering-geometry-browser.mjs'
      - 'tests/fixtures/centering-geometry.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/browser-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify all review JPEGs
        run: |
          python -m pip install --quiet pillow
          python tools/audit_review_assets.py

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate build and student schema
        run: |
          npm ci
          npm run test:student
          npm run test:state
          npm run test:geometry
          npm run test:reliability
          npm run build

      - name: Use standard Ubuntu mirror on EC2 runners
        run: |
          sudo python3 - <<'PYTHON'
          import re
          from pathlib import Path
          folder=Path('/etc/apt/sources.list.d')
          paths=[Path('/etc/apt/sources.list'),*folder.glob('*.sources'),*folder.glob('*.list')]
          for path in paths:
              if not path.is_file():
                  continue
              original=path.read_text()
              updated=re.sub(r'https?://[a-zA-Z0-9.-]+\.ec2\.archive\.ubuntu\.com/ubuntu/?',
                             'https://archive.ubuntu.com/ubuntu/',original)
              if updated!=original:
                  path.write_text(updated)
                  print('Using standard HTTPS Ubuntu archive for',path.name)
          PYTHON

      - name: Install browser engines
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit

      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/site.log 2>&1 &
          sleep 2

      - name: Test Chromium Firefox and WebKit
        run: node tests/browser-compat.mjs

      - name: Test perspective and invalid geometry in three browsers
        run: npm run test:geometry:browser

      - name: Test reliable review and recovery in three browsers
        run: npm run test:reliability:browser

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-compat-screenshots
          path: 'browser-*.png'
          if-no-files-found: ignore
