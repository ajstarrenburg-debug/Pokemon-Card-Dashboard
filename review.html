*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}

main{display:grid;grid-template-columns:minmax(360px,720px) minmax(320px,430px);gap:18px;max-width:1200px;margin:auto;padding:18px}
.cardwrap{background:#080a0e;border-radius:14px;padding:12px;display:flex;justify-content:center;align-items:center;min-height:70vh;overflow:auto}
.stage{position:relative;width:min(630px,100%);aspect-ratio:630/880;touch-action:none;user-select:none}
.stage .sprite,.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}.stage .sprite{background-repeat:no-repeat;background-size:400% 400%;background-image:var(--sprite);border-radius:8px}svg{overflow:visible}
.outer{fill:none;stroke:var(--cyan);stroke-width:2;stroke-dasharray:8 7;vector-effect:non-scaling-stroke}.edge{stroke:var(--mag);stroke-width:2.5;vector-effect:non-scaling-stroke}.hit{stroke:transparent;stroke-width:24;vector-effect:non-scaling-stroke;cursor:grab}.handle{fill:#0d1015;stroke:var(--mag);stroke-width:3;vector-effect:non-scaling-stroke;cursor:grab}
.side{background:var(--panel);border-radius:14px;padding:16px}h2{margin:0 0 4px;font-size:22px}.muted{color:var(--muted)}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#26303d;margin:5px 5px 5px 0;font-size:12px}.warn{border-left:4px solid var(--warn);padding:10px;background:#2a2115;border-radius:8px;margin:12px 0}.good{border-left:4px solid var(--ok);padding:10px;background:#12271f;border-radius:8px;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.metric{background:#10141b;border-radius:10px;padding:10px}.metric b{font-size:18px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.progress{font-variant-numeric:tabular-nums}textarea{width:100%;height:80px;background:#10141b;color:white;border:1px solid #3a4555;border-radius:8px;padding:8px}
@media(max-width:850px){main{grid-template-columns:1fr;padding:8px}.cardwrap{min-height:auto}header{padding:10px}}

<label>Notitie</label><textarea id="note" placeholder="Alleen indien nuttig..."></textarea>
<div class="controls"><button class="primary" id="save">Bevestig → volgende</button><button id="skip">Skip</button><button id="export">Export Gold labels JSON</button></div>

const KEY='pokemon_inner_gold_v04'; let idx=0, history=[];
document.documentElement.style.setProperty('--sprite','url("data:image/jpeg;base64,'+(window.SPRITE_B64||'')+'")');
let saved=JSON.parse(localStorage.getItem(KEY)||'{}'); let cur=null;
const $=id=>document.getElementById(id);
function seedOf(it){return {L:+it.L,R:+it.R,T:+it.T,B:+it.B}}
function stateFor(it){let s=saved[it.card_id]; return s?{...s,box:{...s.box}}:{card_id:it.card_id,mode:it.mode,box:seedOf(it),note:'',confirmed:false}}
function pct(a,b){let s=a+b;return s?[(100*a/s),(100*b/s)]:[50,50]}
function updateGeom(){let b=cur.box; let els={lL:['x1','x2',b.L],lR:['x1','x2',b.R],lT:['y1','y2',b.T],lB:['y1','y2',b.B],hL:['x1','x2',b.L],hR:['x1','x2',b.R],hT:['y1','y2',b.T],hB:['y1','y2',b.B]};
 for(let [id,[a,c,v]] of Object.entries(els)){$(id).setAttribute(a,v);$(id).setAttribute(c,v)}
 ['lL','lR','hL','hR'].forEach(id=>{$(id).setAttribute('y1',0);$(id).setAttribute('y2',880)}); ['lT','lB','hT','hB'].forEach(id=>{$(id).setAttribute('x1',0);$(id).setAttribute('x2',630)});
 let cs={cTL:[b.L,b.T],cTR:[b.R,b.T],cBR:[b.R,b.B],cBL:[b.L,b.B]};
 for(let [id,p] of Object.entries(cs)){$(id).setAttribute('cx',p[0]);$(id).setAttribute('cy',p[1])}
 let lr=pct(b.L,630-b.R),tb=pct(b.T,880-b.B);$('lr').textContent=lr[0].toFixed(1)+' / '+lr[1].toFixed(1);$('tb').textContent=tb[0].toFixed(1)+' / '+tb[1].toFixed(1);
 let hide=cur.mode!=='inner_edge';$('svg').style.opacity=hide?.28:1;
}
function render(){let it=ITEMS[idx];cur=stateFor(it);let bx=(it.sprite_col/3*100).toFixed(5)+'%';let by=(it.sprite_row/3*100).toFixed(5)+'%';$('img').style.backgroundPosition=bx+' '+by;$('title').textContent=it.card_id+' · '+it.name;$('meta').textContent=it.layout.replaceAll('_',' ')+' · '+(idx+1)+' / '+ITEMS.length;$('mode').value=cur.mode;$('note').value=cur.note||'';$('outer').textContent=it.outer_status.replace('TRANSFER_','');$('seed').textContent=it.inner_status.replace('MULTIVIEW_','');

function persist(conf=false){cur.note=$('note').value;cur.mode=$('mode').value;if(conf)cur.confirmed=true;saved[cur.card_id]=cur;localStorage.setItem(KEY,JSON.stringify(saved));}
function pointerPos(e){let r=$('svg').getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*630,y:(e.clientY-r.top)/r.height*880}}
let drag=null,start=null;
$('svg').addEventListener('pointerdown',e=>{let t=e.target;if(!t.dataset.side&&!t.dataset.corner)return;e.preventDefault();t.setPointerCapture(e.pointerId);drag=t.dataset.side||t.dataset.corner;start={...cur.box};history.push(start);});
$('svg').addEventListener('pointermove',e=>{if(!drag)return;let p=pointerPos(e),b=cur.box;if(drag==='L')b.L=Math.max(0,Math.min(p.x,b.R-8));else if(drag==='R')b.R=Math.min(630,Math.max(p.x,b.L+8));else if(drag==='T')b.T=Math.max(0,Math.min(p.y,b.B-8));else if(drag==='B')b.B=Math.min(880,Math.max(p.y,b.T+8));else{if(drag.includes('L'))b.L=Math.max(0,Math.min(p.x,b.R-8));if(drag.includes('R'))b.R=Math.min(630,Math.max(p.x,b.L+8));if(drag.includes('T'))b.T=Math.max(0,Math.min(p.y,b.B-8));if(drag.includes('B'))b.B=Math.min(880,Math.max(p.y,b.T+8));}updateGeom();});
$('svg').addEventListener('pointerup',()=>drag=null);$('svg').addEventListener('pointercancel',()=>drag=null);

render();
