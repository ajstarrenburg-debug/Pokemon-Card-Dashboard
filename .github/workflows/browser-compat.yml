name: Browser compatibility check

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'review.html'
      - 'review.css'
      - 'review.js'
      - 'cards/**'
      - 'tests/browser-compat.mjs'
      - 'training/**'
      - 'tools/build_student_dataset.mjs'
      - '.github/workflows/browser-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify all review JPEGs
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          cards = sorted(Path('cards').glob('A-B*.jpg'))
          assert len(cards) == 16, f'expected 16 cards, found {len(cards)}'
          for path in cards:
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  assert image.size == (630, 880), (path, image.size)
                  assert image.mode == 'RGB', (path, image.mode)
              print('JPEG_OK', path.name)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate build and student schema
        run: |
          npm ci
          npm run test:student
          npm run build

      - name: Install browser engines
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit

      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/site.log 2>&1 &
          sleep 2

      - name: Test Chromium Firefox and WebKit
        run: node tests/browser-compat.mjs

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-compat-screenshots
          path: 'browser-*.png'
          if-no-files-found: ignore
