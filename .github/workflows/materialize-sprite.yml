name: Materialize card sprite

on:
  push:
    branches: [main]
    paths:
      - 'sprite/data.js'
      - '.github/workflows/materialize-sprite.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode sprite JPEG
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re
          src = Path('sprite/data.js').read_text(encoding='utf-8-sig')
          marker = 'window.SPRITE_B64='
          pos = src.find(marker)
          if pos < 0:
              raise SystemExit('SPRITE_B64 marker not found')
          rhs = src[pos + len(marker):]
          q1 = rhs.find('"')
          q2 = rhs.rfind('"')
          if q1 < 0 or q2 <= q1:
              raise SystemExit('Could not find base64 quotes')
          payload = rhs[q1+1:q2]
          payload = re.sub(r'[^A-Za-z0-9+/=]', '', payload)
          raw = base64.b64decode(payload, validate=False)
          if not raw.startswith(b'\xff\xd8'):
              raise SystemExit('Decoded data does not start as JPEG')
          eoi = raw.rfind(b'\xff\xd9')
          if eoi < 0:
              raise SystemExit('Decoded data has no JPEG end marker')
          raw = raw[:eoi+2]
          Path('sprite/cards.jpg').write_bytes(raw)
          print('Wrote sprite/cards.jpg:', len(raw), 'bytes')
          PY
      - name: Commit generated JPEG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sprite/cards.jpg
          if git diff --cached --quiet; then
            echo "No JPEG change"
          else
            git commit -m "Materialize card sprite JPEG"
            git push
          fi
